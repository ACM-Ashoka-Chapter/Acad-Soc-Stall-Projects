<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Internship Oracle &mdash; ACM Ashoka</title>
<style>
:root{
  --ink:#eaf1fa; --dim:#93a7c2; --sil:#cbd8ea; --sil2:#f4f8ff; --acm:#1B365D;
  --bg0:#060b14;
  --line:rgba(203,216,234,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #1B365D 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 110%, #12233d 0%, transparent 60%),
    var(--bg0);
  color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  min-height:100%;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(1.4px 1.4px at 20% 30%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.2px 1.2px at 70% 15%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.6px 1.6px at 40% 75%,rgba(255,255,255,.35),transparent),
    radial-gradient(1.2px 1.2px at 85% 65%,rgba(255,255,255,.4),transparent),
    radial-gradient(1.3px 1.3px at 12% 85%,rgba(255,255,255,.3),transparent),
    radial-gradient(1.1px 1.1px at 60% 45%,rgba(255,255,255,.25),transparent),
    radial-gradient(1.5px 1.5px at 92% 30%,rgba(255,255,255,.3),transparent);
  animation:twinkle 6s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 22px 70px}
.screen{display:none;animation:fade .6s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

header.brand{text-align:center;margin-bottom:26px}
.brand .club{
  font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  letter-spacing:.42em;font-size:11px;text-transform:uppercase;color:var(--sil);
  opacity:.9;padding-left:.42em;
}
.brand h1{
  font-size:clamp(34px,6.5vw,60px);font-weight:400;letter-spacing:.02em;line-height:1.05;margin:10px 0 6px;
  background:linear-gradient(180deg,#ffffff,var(--sil) 55%,#6f8db5);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand .sub{color:var(--dim);font-style:italic;font-size:clamp(14px,2.2vw,17px)}
.rule{width:180px;height:1px;margin:20px auto;background:linear-gradient(90deg,transparent,var(--line),transparent);position:relative}
.rule::after{content:"\2726";position:absolute;top:-11px;left:50%;transform:translateX(-50%);color:var(--sil);font-size:15px;padding:0 8px}

.panel{
  max-width:520px;margin:0 auto;background:linear-gradient(180deg,rgba(27,54,93,.82),rgba(10,18,32,.88));
  border:1px solid var(--line);border-radius:18px;padding:32px 30px;
  box-shadow:0 26px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
}
label{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--sil);margin:0 0 9px}
input,select{
  width:100%;padding:14px 15px;border-radius:11px;border:1px solid rgba(203,216,234,.30);
  background:rgba(7,13,24,.78);color:var(--ink);font-size:17px;font-family:inherit;outline:none;
}
input:focus,select:focus{border-color:var(--sil);box-shadow:0 0 0 3px rgba(140,180,230,.20)}
select option{background:#12233d;color:#eaf1fa}
.field{margin-bottom:22px}
.btn{
  display:block;width:100%;margin-top:8px;padding:15px;border:none;border-radius:11px;cursor:pointer;
  font-family:ui-sans-serif,system-ui,sans-serif;font-weight:650;letter-spacing:.16em;text-transform:uppercase;font-size:12.5px;
  background:linear-gradient(180deg,#ffffff,var(--sil));color:#0f1c30;
  box-shadow:0 10px 26px rgba(120,160,210,.26);transition:transform .15s,box-shadow .15s,filter .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 15px 34px rgba(120,160,210,.38)}
.btn.ghost{background:transparent;color:var(--sil);border:1px solid var(--line);box-shadow:none}
.err{color:#ff9a9a;font-size:13px;min-height:18px;margin-top:-12px;margin-bottom:10px;font-style:italic}

.instruct{text-align:center;margin-bottom:8px}
.instruct h2{font-weight:400;font-size:clamp(22px,3.6vw,31px);color:var(--sil2)}
.instruct p{color:var(--dim);margin-top:8px;font-style:italic}
.counter{font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.3em;font-size:11px;text-transform:uppercase;
  color:var(--sil);margin-top:14px}

.spread{display:grid;grid-template-columns:repeat(6,1fr);gap:18px;max-width:900px;margin:28px auto 0}
@media(max-width:820px){.spread{grid-template-columns:repeat(4,1fr);gap:12px}}
@media(max-width:480px){.spread{grid-template-columns:repeat(3,1fr);gap:9px}}
.slot{perspective:1100px;aspect-ratio:2/3.3;cursor:pointer}
.slot.taken{cursor:default}
.slot.dim{opacity:.28;filter:saturate(.4);pointer-events:none;transform:scale(.94);transition:.5s}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,.1,.2,1)}
.slot.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:11px;overflow:hidden;
  border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.back{background:
   repeating-linear-gradient(45deg,rgba(203,216,234,.10) 0 6px,transparent 6px 12px),
   linear-gradient(160deg,#24456f,#0b1626);
  display:flex;align-items:center;justify-content:center}
.back span{font-size:26px;color:var(--sil);opacity:.75}
.slot:not(.taken):hover .inner{transform:translateY(-9px) rotate(-1.2deg)}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#f7fafe,#ccd9ea);
  color:#16233d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:8px;
  border:1px solid #4a6fa5}
.front svg{width:58%;height:auto}
.front .nm{font-size:11.5px;text-align:center;letter-spacing:.05em;line-height:1.2}

.reading{max-width:960px;margin:0 auto}
.who{text-align:center;color:var(--dim);font-style:italic;margin-bottom:22px}
.who b{color:var(--sil2);font-style:normal}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}
@media(max-width:700px){.cards3{grid-template-columns:1fr}}
.rcard{background:linear-gradient(180deg,rgba(27,54,93,.78),rgba(9,16,30,.85));border:1px solid var(--line);
  border-radius:15px;padding:20px 18px;text-align:center;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.rcard svg{width:74px;height:74px;margin-bottom:10px}
.rcard h3{font-weight:400;font-size:20px;color:var(--sil2);margin-bottom:9px}
.rcard p{font-size:15px;line-height:1.55;color:#cfdaea}
.verdict{text-align:center;font-size:clamp(16px,2.4vw,19px);line-height:1.6;color:#dfe8f5;font-style:italic;
  max-width:720px;margin:0 auto 30px}
.reveal{text-align:center;border:1px solid var(--line);border-radius:18px;padding:34px 24px;
  background:radial-gradient(600px 220px at 50% 0%,rgba(190,212,240,.16),transparent 70%),rgba(8,15,28,.72);
  animation:rise .7s .2s ease both}
.reveal .lbl{font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.34em;text-transform:uppercase;
  font-size:11px;color:var(--sil);margin-bottom:14px}
.reveal .co{font-size:clamp(30px,6vw,54px);line-height:1.1;
  background:linear-gradient(180deg,#ffffff,var(--sil) 65%,#7fa3cd);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.reveal .tag{color:var(--dim);margin-top:14px;font-style:italic;font-size:15px}
.again{max-width:340px;margin:34px auto 0}
footer{text-align:center;color:#63758f;font-size:11.5px;margin-top:44px;
  font-family:ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">

<header class="brand">
  <div class="club">Association for Computing Machinery &middot; Ashoka</div>
  <h1>The Internship Oracle</h1>
  <div class="sub">Three cards. One summer. No refunds.</div>
  <div class="rule"></div>
</header>

<section id="s1" class="screen on">
  <div class="panel">
    <div class="field">
      <label for="nm">Your Name</label>
      <input id="nm" type="text" autocomplete="off" placeholder="Who seeks the reading?">
    </div>
    <div class="field">
      <label for="mj">Your Major</label>
      <select id="mj"><option value="">Choose your discipline&hellip;</option></select>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Consult the Deck</button>
  </div>
</section>

<section id="s2" class="screen">
  <div class="instruct">
    <h2>Choose three cards</h2>
    <p>Do not think. The deck already knows.</p>
    <div class="counter" id="cnt">0 of 3 chosen</div>
  </div>
  <div class="spread" id="spread"></div>
</section>

<section id="s3" class="screen">
  <div class="reading">
    <div class="who" id="who"></div>
    <div class="cards3" id="cards3"></div>
    <div class="verdict" id="verdict"></div>
    <div class="reveal">
      <div class="lbl">Next Summer &middot; Your Placement</div>
      <div class="co" id="company"></div>
      <div class="tag" id="tagline"></div>
    </div>
    <button class="btn ghost again" id="again">Draw Again</button>
  </div>
</section>

<footer>ACM Ashoka &mdash; for entertainment purposes only</footer>
</div>
<script>
/* ============================================================
   THE INTERNSHIP ORACLE  —  ACM Ashoka
   Single file. No dependencies. Open index.html and go.
   ============================================================ */

/* ---------- 1. THE SIX PATHS (archetypes) ---------- */
const PATHS = {
  build: {
    name: "The Builder",
    line: "Your cards lean toward making. You are happiest with your hands in the machinery, shipping a thing that did not exist on Monday."
  },
  analyse: {
    name: "The Analyst",
    line: "Your cards lean toward pattern. You will find the signal everyone else walked past, and you will be insufferable about it."
  },
  tell: {
    name: "The Storyteller",
    line: "Your cards lean toward voice. Your gift is that people actually listen when you explain the thing."
  },
  steward: {
    name: "The Steward",
    line: "Your cards lean toward care. You are drawn to work that outlives the internship, and to rooms where the stakes are real."
  },
  deal: {
    name: "The Dealmaker",
    line: "Your cards lean toward leverage. You read rooms faster than documents, and the summer will reward that."
  },
  seek: {
    name: "The Seeker",
    line: "Your cards lean toward the unanswered. You want the question nobody has closed yet, and you will happily be underpaid for it."
  }
};

/* ---------- 2. THE DECK (22 cards) ---------- */
const G = {

  mirror:  '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><ellipse cx="50" cy="42" rx="24" ry="30"/><path d="M50 72v18M38 90h24"/><path d="M40 32c6 6 14 6 20 0" stroke="#4a6fa5"/></svg>',
  scales:  '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M50 16v62M32 84h36"/><path d="M20 32h60"/><path d="M20 32l-9 18a11 9 0 0022 0z" fill="#4a6fa5" fill-opacity=".35"/><path d="M80 32l-9 18a11 9 0 0022 0z" fill="#4a6fa5" fill-opacity=".35"/></svg>',
  constel: '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="2.5" stroke-linecap="round"><path d="M22 70l14-26 22 10 20-32"/><circle cx="22" cy="70" r="4.5" fill="#16233d"/><circle cx="36" cy="44" r="4.5" fill="#16233d"/><circle cx="58" cy="54" r="4.5" fill="#16233d"/><circle cx="78" cy="22" r="6.5" fill="#4a6fa5" stroke="none"/></svg>',
  hour:    '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linejoin="round"><path d="M28 14h44M28 86h44"/><path d="M30 14c0 20 20 26 20 36s-20 16-20 36M70 14c0 20-20 26-20 36s20 16 20 36"/><path d="M42 74c4-8 12-8 16 0z" fill="#4a6fa5" stroke="none"/></svg>',
  voice:   '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M22 40h14l20-16v52L36 60H22z" fill="#4a6fa5" fill-opacity=".3"/><path d="M66 36c7 8 7 20 0 28M78 26c13 14 13 34 0 48"/></svg>',
  mask:    '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M22 30h56c0 30-12 46-28 46S22 60 22 30z" fill="#4a6fa5" fill-opacity=".25"/><circle cx="39" cy="46" r="4" fill="#16233d"/><circle cx="61" cy="46" r="4" fill="#16233d"/><path d="M40 60c6 5 14 5 20 0"/></svg>',
  loom:    '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M24 20v60M40 20v60M56 20v60M72 20v60"/><path d="M18 36c14 8 22-8 36 0s22-8 34 0" stroke="#4a6fa5"/><path d="M18 62c14 8 22-8 36 0s22-8 34 0" stroke="#4a6fa5"/></svg>',
  root:    '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M50 14v40"/><path d="M50 34c-10-4-16-14-14-22 10 0 16 8 14 22zM50 34c10-4 16-14 14-22-10 0-16 8-14 22z" fill="#4a6fa5" fill-opacity=".3"/><path d="M50 54c-8 8-10 20-8 32M50 54c8 8 10 20 8 32M50 54v32"/></svg>',

  gate:    '<svg viewBox="0 0 100 100" fill="none" stroke="#16233d" stroke-width="3" stroke-linecap="round"><path d="M20 86V38a30 30 0 0160 0v48"/><path d="M50 86V38"/><circle cx="40" cy="60" r="3.5" fill="#4a6fa5" stroke="none"/><circle cx="60" cy="60" r="3.5" fill="#4a6fa5" stroke="none"/><path d="M12 86h76"/></svg>',

const DECK = [
  {n:"The Forge",       p:"build",   g:G.forge,   m:"Heat, hammer, repeat. You learn by breaking the thing and building it back better."},
  {n:"The Blueprint",   p:"build",   g:G.blue,    m:"You see the whole structure before the first brick. Others call it planning; you call it obvious."},
  {n:"The Bridge",      p:"build",   g:G.bridge,  m:"You connect two sides that were never speaking. Nobody notices a bridge until it is gone."},
  {n:"The Engine",      p:"build",   g:G.engine,  m:"Relentless, unglamorous motion. You are the reason the thing still runs on a Sunday."},
  {n:"The Mirror",      p:"analyse", g:G.mirror,  m:"You reflect the data back without flattering it. This makes you useful and occasionally unpopular."},
  {n:"The Scales",      p:"analyse", g:G.scales,  m:"Every claim gets weighed. You would rather be slow and right than fast and quoted."},
  {n:"The Constellation",p:"analyse",g:G.constel, m:"Scattered points, one shape. You find the pattern that was always there, waiting."},
  {n:"The Hourglass",   p:"analyse", g:G.hour,    m:"You think in trends, not moments. What looks like noise to others is a curve to you."},
  {n:"The Voice",       p:"tell",    g:G.voice,   m:"You make complicated things land. Rooms get quieter when you start explaining."},
  {n:"The Mask",        p:"tell",    g:G.mask,    m:"You can hold a perspective that is not your own. That is craft, not dishonesty."},
  {n:"The Loom",        p:"tell",    g:G.loom,    m:"Loose threads, one fabric. You turn a pile of facts into something worth reading."},
  {n:"The Root",        p:"steward", g:G.root,    m:"You care about what grows after you leave. Slow work, deep hold."},
  {n:"The Shield",      p:"steward", g:G.shield,  m:"You stand in front of things that cannot defend themselves. Quietly, and usually unthanked."},
  {n:"The Gate",        p:"steward", g:G.gate,    m:"You decide who gets through. Handle that with more care than most people would."},
  {n:"The Crown",       p:"deal",    g:G.crown,   m:"You end up running the group project. Nobody voted; it simply happened."},
  {n:"The Key",         p:"deal",    g:G.key,     m:"You find the one door that opens. Access is a skill and you have it."},
  {n:"The Wheel",       p:"deal",    g:G.wheel,   m:"Timing over talent. You move when the room turns, and the room turns often."},
  {n:"The Coin",        p:"deal",    g:G.coin,    m:"You understand what things are actually worth. Including yourself, eventually."},
  {n:"The Lantern",     p:"seek",    g:G.lantern, m:"You walk toward the dark part on purpose. The light is small but it is yours."},
  {n:"The Wanderer",    p:"seek",    g:G.wander,  m:"No fixed path, no wasted step. Your detours turn out to be the actual route."},
  {n:"The Door",        p:"seek",    g:G.door,    m:"An opening you did not apply for. Say yes before you feel ready."},
  {n:"The Serpent",     p:"seek",    g:G.serpent, m:"You shed what no longer fits, including old plans. Growth looks like abandonment from outside."}

/* ---------- 3. THE PLACEMENTS ---------- */

/* ---------- 4. FLAVOUR ---------- */
const TAGLINES = [
  "The cards were unusually confident about this one.",
  "Do not argue with the deck. It has seen worse.",
  "Accept the offer. Negotiate the stipend.",
  "You will complain about the commute and stay anyway.",
  "This was always going to happen. Sorry.",
  "Three cards, one insufferable LinkedIn post.",
  "The deck suggests you learn to make coffee first.",
  "Somewhere, a recruiter just felt a chill.",
  "Fated. Underpaid. Formative.",
  "Screenshot this. You will want proof.",
  "Your parents will ask what this is. Twice.",
  "The stipend is largely spiritual.",
  "You will describe this as a learning experience.",
  "Excellent for the resume. Ruinous for the sleep schedule.",
  "The deck has placed you. The deck will not explain itself.",
  "You will be given a laptop and no instructions.",
  "Certificate on the last day. That is the whole compensation.",
  "The cards hesitated, then doubled down.",
  "Free lunch on Fridays. That is the offer.",
  "You will learn Excel against your will.",
  "Your friends drew better. Your friends also peaked early.",
  "The deck wants you to know it could have been much worse.",
  "Nine weeks, one spreadsheet, infinite growth.",
  "You will be the youngest person in every meeting.",
  "The deck insists this builds character."
];

/* ---------- 5. ENGINE ---------- */
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };

let state = { name: "", major: "", chosen: [], locked: false };

/* populate majors */
Object.keys(MAJORS).sort().forEach(m => {
  const o = document.createElement("option");
  o.value = m; o.textContent = m;
  $("mj").appendChild(o);
});

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

$("go").addEventListener("click", () => {
  const n = $("nm").value.trim();
  const m = $("mj").value;
  if (!n) { $("err").textContent = "The oracle needs a name to address."; return; }
  if (!m) { $("err").textContent = "Choose a major. The oracle does not guess."; return; }
  $("err").textContent = "";
  state = { name: n, major: m, chosen: [], locked: false };
  dealSpread();
  show("s2");
});

$("nm").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });

function dealSpread() {
  const cards = shuffle(DECK).slice(0, 12);
  const sp = $("spread");
  sp.innerHTML = "";
  $("cnt").textContent = "0 of 3 chosen";
  cards.forEach((card, i) => {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.style.animation = "rise .5s " + (i * 0.045) + "s ease both";
    slot.innerHTML =
      '<div class="inner">' +
        '<div class="face back"><span>&#10022;</span></div>' +
        '<div class="face front">' + card.g + '<div class="nm">' + card.n + '</div></div>' +
      '</div>';
    slot.addEventListener("click", () => choose(slot, card));
    sp.appendChild(slot);
  });
}

function choose(slot, card) {
  if (state.locked || slot.classList.contains("taken")) return;
  slot.classList.add("taken", "flip");
  state.chosen.push(card);
  $("cnt").textContent = state.chosen.length + " of 3 chosen";
  if (state.chosen.length === 3) {
    state.locked = true;
    document.querySelectorAll(".slot:not(.taken)").forEach(s => s.classList.add("dim"));
    setTimeout(reveal, 1500);
  }
}

function reveal() {
  const tally = {};
  state.chosen.forEach(c => tally[c.p] = (tally[c.p] || 0) + 1);
  let best = 0, leaders = [];
  for (const k in tally) {
    if (tally[k] > best) { best = tally[k]; leaders = [k]; }
    else if (tally[k] === best) leaders.push(k);
  }
  let path = pick(leaders);
  const pool = MAJORS[state.major];
  if (!pool[path] || !pool[path].length) {
    path = pick(Object.keys(pool).filter(k => pool[k].length));
  }

  $("who").innerHTML = "A reading for <b>" + escapeHtml(state.name) + "</b>, of " + escapeHtml(state.major) + ".";

  $("cards3").innerHTML = state.chosen.map((c, i) =>
    '<div class="rcard" style="animation-delay:' + (i * 0.18) + 's">' +
      c.g + '<h3>' + c.n + '</h3><p>' + c.m + '</p>' +
    '</div>'
  ).join("");

  const spread = best === 3
    ? "All three cards speak with one voice &mdash; the deck has rarely been this blunt. "
    : best === 2
      ? "Two of your three cards pull in the same direction. "
      : "Your three cards each pull elsewhere, so the deck has chosen for you. ";
  $("verdict").innerHTML = spread + PATHS[path].line;

  $("company").textContent = pick(pool[path]);
  $("tagline").textContent = pick(TAGLINES);

  show("s3");
}

$("again").addEventListener("click", () => {
  $("nm").value = ""; $("mj").value = ""; $("err").textContent = "";
  show("s1");
  $("nm").focus();
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
